name: Main
on:
  push:
    branches:
      - 'master'

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    name: Test And Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Use Node.js 20
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json', 'plugins/gatsby-plugin-social-banners/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Clear npm cache
        run: npm cache clean --force
      - name: Install root dependencies
        run: npm ci || npm install
      - name: Install plugin dependencies
        run: |
          if [ -d "plugins/gatsby-plugin-social-banners" ] && [ -f "plugins/gatsby-plugin-social-banners/package.json" ]; then
            cd plugins/gatsby-plugin-social-banners && npm ci || npm install
          else
            echo "Plugin directory or package.json not found, skipping plugin install"
          fi
      - name: Debug npm ci failure
        if: failure()
        run: |
          cat /home/runner/.npm/_logs/*.log || echo "No npm log file found"
          if [ -f "plugins/gatsby-plugin-social-banners/package.json" ]; then
            cat plugins/gatsby-plugin-social-banners/package.json
          fi
      - name: Cypress run
        uses: cypress-io/github-action@v6
        env:
          NODE_OPTIONS: --openssl-legacy-provider # Fix for OpenSSL error
        with:
          start: npm run develop
          wait-on-timeout: 400
          wait-on: 'http://localhost:8000'
      - name: Build site
        env:
          NODE_OPTIONS: --openssl-legacy-provider # Apply to build step
        run: npm run build
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          publish_branch: master
          publish_dir: ./public
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Archive videos
        uses: actions/upload-artifact@v4
        with:
          name: cypress-test-records
          path: cypress/videos
